name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m json.tool n8n/workflows/sasi-clinical-compile.json >/dev/null
      - run: systemd-analyze verify services/extracao-clinica-sasi.service
      - run: bash -n scripts/install-local.sh
